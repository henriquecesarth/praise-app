<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2A1F" />
    <title>LouvAIO — Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0B1913; color: #F5EFE6; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #1B4534; border-radius: 18px; background: #0F2A1F; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 1.45rem; color: #F5EFE6; }
      p { color: #B4C2B9; line-height: 1.55; }
      button { min-width: 44px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 10px; background: #B85A3C; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #C96F52; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>O LouvAIO não armazena dados privados do ministério no cache. Reconecte-se para acessar repertório, escalas e configurações.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
