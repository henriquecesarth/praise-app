name: LouvAIO Unified Staging CI & APK Build

on:
  push:
    branches:
      - 'integration/louvaio-unified-20261112'
      - 'fix/louvaio-audit-remediation-20261113'
    paths:
      - 'mobile/**'
      - '.github/workflows/unified-staging-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-staging-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-apk:
    name: Validate, Analyze & Build Staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Validate isolated staging configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.LOUVAIO_STAGING_GOOGLE_SERVICES_JSON || secrets.FIREBASE_STAGING_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          raw = os.environ.get('GOOGLE_SERVICES_JSON', '').strip()
          if not raw:
              raise SystemExit('Missing secret: LOUVAIO_STAGING_GOOGLE_SERVICES_JSON')
          try:
              config = json.loads(raw)
          except json.JSONDecodeError:
              raise SystemExit('LOUVAIO_STAGING_GOOGLE_SERVICES_JSON is not valid JSON.')
          info = config.get('project_info', {})
          clients = config.get('client', [])
          staging_clients = [
              c for c in clients
              if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.louvaio.app.staging'
          ]
          project_id = info.get('project_id')
          if project_id != 'louvaio-staging' or not staging_clients:
              raise SystemExit(f'Firebase Android config must match project louvaio-staging and package com.louvaio.app.staging (got {project_id}).')
          out = 'android/app/src/staging/google-services.json'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out, 'w', encoding='utf-8') as f:
              json.dump(config, f)

          client = staging_clients[0]
          app_id = client.get('client_info', {}).get('mobilesdk_app_id', '')
          api_keys = [k.get('current_key', '') for k in client.get('api_key', [])]
          api_key = api_keys[0] if api_keys else ''
          sender_id = str(info.get('project_number', ''))
          storage_bucket = info.get('storage_bucket', '')

          if not (app_id and api_key and sender_id and storage_bucket):
              raise SystemExit('Incomplete Firebase configuration in google-services.json.')

          # Mask sensitive API key in runner output
          print(f'::add-mask::{api_key}')

          github_env = os.environ.get('GITHUB_ENV')
          if github_env:
              with open(github_env, 'a', encoding='utf-8') as env_file:
                  env_file.write(f'FIREBASE_STAGING_PROJECT_ID={project_id}\n')
                  env_file.write(f'FIREBASE_STAGING_API_KEY={api_key}\n')
                  env_file.write(f'FIREBASE_STAGING_APP_ID={app_id}\n')
                  env_file.write(f'FIREBASE_STAGING_MESSAGING_SENDER_ID={sender_id}\n')
                  env_file.write(f'FIREBASE_STAGING_STORAGE_BUCKET={storage_bucket}\n')

          print('Staging Firebase configuration validated, written to android/app/src/staging/google-services.json and exported to GITHUB_ENV.')
          PY

      - name: Verify Flutter & Dart environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run focused tests (Smart Chords, Repertoire, Auth, Vocal M21)
        run: flutter test test/features/smart_chords test/features/repertoire test/features/auth test/features/vocal

      - name: Build staging debug APK
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --flavor staging \
            --target lib/main.dart \
            --dart-define=APP_ENV=staging \
            --dart-define=FIREBASE_ENV=staging \
            --dart-define=API_BASE_URL=https://louvaio-staging-api.vercel.app/api/v1 \
            --dart-define=FIREBASE_STAGING_PROJECT_ID="$FIREBASE_STAGING_PROJECT_ID" \
            --dart-define=FIREBASE_STAGING_API_KEY="$FIREBASE_STAGING_API_KEY" \
            --dart-define=FIREBASE_STAGING_APP_ID="$FIREBASE_STAGING_APP_ID" \
            --dart-define=FIREBASE_STAGING_MESSAGING_SENDER_ID="$FIREBASE_STAGING_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_STAGING_STORAGE_BUCKET="$FIREBASE_STAGING_STORAGE_BUCKET"
          test -s build/app/outputs/flutter-apk/app-staging-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-staging-debug.apk > build/app/outputs/flutter-apk/apk-sha256.txt
          cat <<EOF > build/app/outputs/flutter-apk/build-manifest.json
          {
            "branch": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "artifact": "louvaio-unified-staging-debug.apk",
            "environment": "staging",
            "flavor": "staging",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload staging APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: louvaio-unified-staging-debug
          path: |
            mobile/build/app/outputs/flutter-apk/app-staging-debug.apk
            mobile/build/app/outputs/flutter-apk/apk-sha256.txt
            mobile/build/app/outputs/flutter-apk/build-manifest.json
          retention-days: 7
          if-no-files-found: error
