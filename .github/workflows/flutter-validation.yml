name: Remote Flutter Validation

on:
  push:
    branches:
      - wip/repertoire-versions-smartchords-20261022
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-validation.yml'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute'
        required: true
        default: 'focused'
        type: choice
        options:
          - focused
          - all

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mobile:
    name: Flutter Analyze & Test (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Verify Flutter & Dart environment
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run Mobile tests
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then
            echo "Running all mobile tests..."
            flutter test
          else
            echo "Running focused mobile tests (Repertoire, Smart Chords, Auth, Core, Preview)..."
            flutter test test/features/repertoire test/features/smart_chords test/features/auth test/core test/preview
          fi
