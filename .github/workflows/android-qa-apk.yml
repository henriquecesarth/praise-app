name: Android QA APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Require registered QA Android app in existing Firebase project
        env:
          FIREBASE_QA_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_QA_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          raw = os.environ.get('FIREBASE_QA_GOOGLE_SERVICES_JSON', '')
          if not raw:
              raise SystemExit('Register com.louvaio.app.qa in Firebase project praise-app-7a362, then add its google-services.json as Actions secret FIREBASE_QA_GOOGLE_SERVICES_JSON.')
          try:
              config = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit('FIREBASE_QA_GOOGLE_SERVICES_JSON must contain the registered QA app configuration.') from exc
          info = config.get('project_info', {})
          project = info.get('project_id')
          clients = [c for c in config.get('client', [])
                     if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.louvaio.app.qa']
          if project != 'praise-app-7a362' or len(clients) != 1:
              raise SystemExit('QA Firebase config must identify project praise-app-7a362 and exactly package com.louvaio.app.qa.')
          client = clients[0]
          app_id = client.get('client_info', {}).get('mobilesdk_app_id', '')
          keys = client.get('api_key', [])
          api_key = keys[0].get('current_key', '') if keys else ''
          sender = str(info.get('project_number', ''))
          bucket = info.get('storage_bucket') or ''
          if (not re.fullmatch(r'1:\d+:android:[A-Za-z0-9]+', app_id)
              or not re.fullmatch(r'[A-Za-z0-9_-]{20,}', api_key)
              or not sender.isdigit() or not bucket):
              raise SystemExit('Registered QA Firebase app is missing valid Android app, API key, sender, or storage metadata.')
          Path('android/app/src/qa').mkdir(parents=True, exist_ok=True)
          Path('android/app/src/qa/google-services.json').write_text(raw, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for name, value in [('FIREBASE_QA_PROJECT_ID', project), ('FIREBASE_QA_API_KEY', api_key),
                                  ('FIREBASE_QA_APP_ID', app_id), ('FIREBASE_QA_MESSAGING_SENDER_ID', sender),
                                  ('FIREBASE_QA_STORAGE_BUCKET', bucket)]:
                  if '\n' in value or '\r' in value:
                      raise SystemExit('Invalid multiline Firebase metadata.')
                  env.write(f'{name}={value}\n')
          print('Registered QA Android configuration matches the existing Firebase project and package.')
          PY

      - name: Verify public Preview backend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.error, urllib.request
          base = 'https://praise-app-gray.vercel.app'
          for path, expected in [('/api/health', 200), ('/api/v1/auth/me', 401)]:
              try:
                  response = urllib.request.urlopen(base + path, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  if response.status != expected or 'application/json' not in response.headers.get('Content-Type', ''):
                      raise SystemExit(f'Preview backend preflight failed at {path}; refusing APK build.')
                  payload = json.load(response)
              if path.endswith('/health') and (payload.get('status') != 'ok' or payload.get('service') != 'praise-backend'):
                  raise SystemExit('Unexpected API health response; refusing APK build.')
              if path.endswith('/auth/me') and not isinstance(payload.get('error'), dict):
                  raise SystemExit('Expected unauthenticated API JSON response; refusing APK build.')
          print('Preview API is reachable and returns the expected unauthenticated response.')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build complete QA app
        env:
          API_BASE_URL: https://praise-app-gray.vercel.app/api/v1
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --flavor qa \
            --target lib/main.dart \
            --dart-define=APP_ENV=development \
            --dart-define=FIREBASE_ENV=qa \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_QA_PROJECT_ID="$FIREBASE_QA_PROJECT_ID" \
            --dart-define=FIREBASE_QA_API_KEY="$FIREBASE_QA_API_KEY" \
            --dart-define=FIREBASE_QA_APP_ID="$FIREBASE_QA_APP_ID" \
            --dart-define=FIREBASE_QA_MESSAGING_SENDER_ID="$FIREBASE_QA_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_QA_STORAGE_BUCKET="$FIREBASE_QA_STORAGE_BUCKET"

      - name: Verify package and embedded app configuration
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-qa-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.louvaio.app.qa'" > /dev/null
          python3 - <<'PY'
          import os, zipfile
          apk='build/app/outputs/flutter-apk/app-qa-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              manifest=archive.read('AndroidManifest.xml')
              kernel=archive.read('assets/flutter_assets/kernel_blob.bin')
          assert b'android.permission.INTERNET' in manifest
          assert b'https://praise-app-gray.vercel.app/api/v1' in kernel
          assert b'praise-app-7a362' in kernel
          assert os.environ['FIREBASE_QA_APP_ID'].encode() in kernel
          PY
          sha256sum "$APK" > build/app/outputs/flutter-apk/qa-apk-sha256.txt
          echo 'QA APK package, Firebase project/app, and Preview API were verified.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: louvaio-android-qa-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-qa-debug.apk
            mobile/build/app/outputs/flutter-apk/qa-apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
