name: Android Staging APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Validate isolated staging configuration
        env:
          API_URL: ${{ vars.STAGING_API_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_STAGING_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STAGING_STORAGE_BUCKET }}
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_STAGING_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.parse
          required = ['API_URL', 'FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY',
                      'FIREBASE_APP_ID', 'FIREBASE_SENDER_ID',
                      'FIREBASE_STORAGE_BUCKET', 'GOOGLE_SERVICES_JSON']
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Missing staging configuration: ' + ', '.join(missing))
          project = os.environ['FIREBASE_PROJECT_ID'].strip()
          if project == 'praise-app-7a362':
              raise SystemExit('Staging Firebase project cannot be the production project.')
          api = urllib.parse.urlsplit(os.environ['API_URL'])
          if (api.scheme != 'https' or api.username or api.password or api.port or
              api.query or api.fragment or api.path != '/api/v1' or
              not (api.hostname or '').endswith('-henriquecesarths-projects.vercel.app')):
              raise SystemExit('STAGING_API_BASE_URL must be an HTTPS Vercel Preview /api/v1 URL.')
          try:
              config = json.loads(os.environ['GOOGLE_SERVICES_JSON'])
          except json.JSONDecodeError:
              raise SystemExit('FIREBASE_STAGING_GOOGLE_SERVICES_JSON is not valid JSON.')
          info = config.get('project_info', {})
          clients = config.get('client', [])
          staging_clients = [c for c in clients if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.louvaio.app.staging']
          if info.get('project_id') != project or not staging_clients:
              raise SystemExit('Firebase Android config must match staging project and package.')
          client = staging_clients[0]
          app_id = client.get('client_info', {}).get('mobilesdk_app_id')
          api_keys = [k.get('current_key') for k in client.get('api_key', [])]
          if os.environ['FIREBASE_API_KEY'] not in api_keys:
              raise SystemExit('Staging Firebase API key does not match google-services.json.')
          if (app_id != os.environ['FIREBASE_APP_ID'] or
              str(info.get('project_number', '')) != os.environ['FIREBASE_SENDER_ID'] or
              info.get('storage_bucket') != os.environ['FIREBASE_STORAGE_BUCKET']):
              raise SystemExit('Staging Firebase options do not match google-services.json.')
          out = 'android/app/src/staging/google-services.json'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out, 'w', encoding='utf-8') as f:
              json.dump(config, f)
          print('Staging Firebase and Preview API settings are present and isolated.')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build staging debug APK
        env:
          API_URL: ${{ vars.STAGING_API_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_STAGING_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STAGING_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --flavor staging \
            --target lib/main.dart \
            --dart-define=APP_ENV=staging \
            --dart-define=FIREBASE_ENV=staging \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=FIREBASE_STAGING_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_STAGING_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_STAGING_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_STAGING_MESSAGING_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_STAGING_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
          test -s build/app/outputs/flutter-apk/app-staging-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-staging-debug.apk > build/app/outputs/flutter-apk/apk-sha256.txt

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: louvaio-android-staging-debug
          path: |
            mobile/build/app/outputs/flutter-apk/app-staging-debug.apk
            mobile/build/app/outputs/flutter-apk/apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
