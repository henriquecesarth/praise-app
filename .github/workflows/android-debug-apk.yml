name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      target_mode:
        description: 'Build target mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - preview
      api_base_url:
        description: 'LouvAIO API Base URL (for full build)'
        required: false
        default: ''

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight supplied Preview API
        if: inputs.target_mode == 'full'
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          url = os.environ['API_URL']
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme != 'https' or parsed.username or parsed.password
              or parsed.port or parsed.query or parsed.fragment
              or parsed.path != '/api/v1'
              or not re.fullmatch(r'praise-[a-z0-9]{9}-henriquecesarths-projects\.vercel\.app', parsed.hostname or '')):
              raise SystemExit('Expected immutable praise-app Preview URL ending in /api/v1; production/custom aliases are forbidden.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'API_URL={url}\n')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          blocked = False
          for path, expected in [('/api/health', 200), ('/api/v1/auth/me', 401)]:
              try:
                  response = opener.open(f'{parsed.scheme}://{parsed.netloc}{path}', timeout=25)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  status = response.code
                  location = response.headers.get('Location', '')
                  content_type = response.headers.get('Content-Type', '')
                  body = response.read(65536)
              print(f'{path}: HTTP {status}; content-type={content_type}')
              if status in (301, 302, 303, 307, 308) and urllib.parse.urlsplit(location).hostname == 'vercel.com':
                  blocked = True
                  continue
              if 'application/json' not in content_type or status != expected:
                  raise SystemExit('Unexpected Preview response; refusing build.')
              data = json.loads(body)
              if path == '/api/health' and (data.get('service') != 'praise-backend' or data.get('preview') is not True):
                  raise SystemExit('Health must identify praise-backend Preview.')
              if path.endswith('/auth/me') and not isinstance(data.get('error'), dict):
                  raise SystemExit('Expected application authentication error.')
          readiness = 'BLOCKED: Vercel SSO intercepts mobile API access. APK is diagnostic only.' if blocked else 'Public API preflight passed; authenticated login and data isolation remain unverified.'
          if blocked:
              print('::warning::' + readiness)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'API: `{url}`\n\n{readiness}\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Verify Flutter & Dart environment
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        env:
          MODE: ${{ inputs.target_mode }}
        run: |
          set -euo pipefail
          if [ -z "$MODE" ]; then
            MODE="full"
          fi

          if [ "$MODE" = "full" ]; then
            echo "=== Building Real Full Android Debug APK ==="
            flutter build apk --debug \
              --flavor production \
              --target lib/main.dart \
              --dart-define=APP_ENV=staging \
              --dart-define=API_BASE_URL="$API_URL"
          else
            echo "=== Building Isolated Safe Preview Debug APK (R3-B) ==="
            flutter build apk --debug \
              --flavor preview \
              --target lib/main_preview.dart \
              --dart-define=SAFE_PREVIEW_MODE=true
          fi

      - name: Verify APK Integrity & Inspect Merged Manifest
        run: |
          echo "=== 1. Check generated APK outputs ==="
          ls -la build/app/outputs/flutter-apk/

          if [ "${{ inputs.target_mode }}" = "preview" ]; then
            APK_FILE=build/app/outputs/flutter-apk/app-preview-debug.apk
          else
            APK_FILE=build/app/outputs/flutter-apk/app-production-debug.apk
          fi
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"

          MODE="${{ github.event.inputs.target_mode }}"
          if [ -z "$MODE" ]; then
            MODE="full"
          fi

          if [ "$MODE" = "preview" ]; then
            echo "=== 2. Locate and inspect preview merged AndroidManifest.xml ==="
            MERGED_MANIFEST=$(find build/app/intermediates -path "*preview*Debug*" -name "AndroidManifest.xml" | head -n 1)
            if [ -z "$MERGED_MANIFEST" ]; then
              MERGED_MANIFEST=$(find build/app/intermediates -name "AndroidManifest.xml" | head -n 1)
            fi
            echo "Merged manifest location: $MERGED_MANIFEST"
            if [ -n "$MERGED_MANIFEST" ] && [ -f "$MERGED_MANIFEST" ]; then
              cat "$MERGED_MANIFEST"

              echo "=== 3. Security Assertions on Preview Merged Manifest ==="
              if grep -i 'android.permission.INTERNET' "$MERGED_MANIFEST"; then
                echo "SECURITY VIOLATION: android.permission.INTERNET found in preview manifest!"
                exit 1
              else
                echo "PASS: android.permission.INTERNET is completely absent from preview manifest."
              fi

              if grep -i 'FirebaseInitProvider' "$MERGED_MANIFEST"; then
                echo "SECURITY VIOLATION: FirebaseInitProvider found in preview manifest!"
                exit 1
              else
                echo "PASS: FirebaseInitProvider is completely disabled / removed."
              fi
            fi

            echo "=== 4. AAPT Badging & Package Inspection (Preview) ==="
            AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
            if [ -n "$AAPT_BIN" ] && [ -x "$AAPT_BIN" ]; then
              echo "Using AAPT: $AAPT_BIN"
              "$AAPT_BIN" dump badging "$APK_FILE" | grep -E 'package|permission' || true
              if "$AAPT_BIN" dump permissions "$APK_FILE" | grep -i 'android.permission.INTERNET'; then
                echo "SECURITY VIOLATION: android.permission.INTERNET found in preview APK binary permissions!"
                exit 1
              else
                echo "PASS: APK binary permissions verified free of INTERNET permission."
              fi
            fi
          else
            echo "=== 2. Locate and inspect production debug merged AndroidManifest.xml ==="
            MERGED_MANIFEST=$(find build/app/intermediates -path "*production*Debug*" -name "AndroidManifest.xml" | head -n 1)
            if [ -z "$MERGED_MANIFEST" ]; then
              MERGED_MANIFEST=$(find build/app/intermediates -name "AndroidManifest.xml" | head -n 1)
            fi
            echo "Merged manifest location: $MERGED_MANIFEST"
            if [ -n "$MERGED_MANIFEST" ] && [ -f "$MERGED_MANIFEST" ]; then
              cat "$MERGED_MANIFEST"

              echo "=== 3. Integrity Assertions on Full App Merged Manifest ==="
              if ! grep -i 'android.permission.INTERNET' "$MERGED_MANIFEST"; then
                echo "ERROR: android.permission.INTERNET missing from full app manifest!"
                exit 1
              else
                echo "PASS: android.permission.INTERNET is present in full app manifest."
              fi
            fi

            echo "=== 4. AAPT Badging & Package Inspection (Full App) ==="
            AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
            if [ -n "$AAPT_BIN" ] && [ -x "$AAPT_BIN" ]; then
              echo "Using AAPT: $AAPT_BIN"
              "$AAPT_BIN" dump badging "$APK_FILE" | grep -E 'package|permission' || true
              if ! "$AAPT_BIN" dump permissions "$APK_FILE" | grep -i 'android.permission.INTERNET'; then
                echo "ERROR: android.permission.INTERNET missing from APK binary permissions!"
                exit 1
              else
                echo "PASS: APK binary permissions verified containing INTERNET permission."
              fi

              if ! "$AAPT_BIN" dump badging "$APK_FILE" | grep "package: name='com.louvaio.app'"; then
                echo "ERROR: Package name must be com.louvaio.app!"
                exit 1
              else
                echo "PASS: Package name confirmed as com.louvaio.app."
              fi
            fi
          fi

      - name: Verify full APK configuration and checksum
        if: inputs.target_mode == 'full'
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-production-debug.apk
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$AAPT_BIN" dump xmltree "$APK" AndroidManifest.xml > /tmp/louvaio-manifest.txt
          for expected in FirebaseInitProvider android.intent.action.SEND text/plain application/pdf 'image/*'; do
            grep -F "$expected" /tmp/louvaio-manifest.txt > /dev/null
          done
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-production-debug.apk') as apk:
              kernel = apk.read('assets/flutter_assets/kernel_blob.bin')
              assert os.environ['API_URL'].encode() in kernel, 'API URL missing from APK'
              assert b'praise-app-7a362' in kernel, 'Firebase project missing from APK'
          PY
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/apk-sha256.txt
          {
            echo "Commit: $GITHUB_SHA"
            echo "Target: lib/main.dart; flavor: production; APP_ENV: staging"
            cat build/app/outputs/flutter-apk/apk-sha256.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event.inputs.target_mode == 'preview') && 'louvaio-android-debug-apk-r3b' || 'louvaio-android-debug-full-app' }}
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/flutter-apk/apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
