name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'M20 branch Preview API; production domains are rejected.'
        required: true
        default: 'https://praise-app-git-feat-m20-phase-8825ce-henriquecesarths-projects.vercel.app/api/v1'

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight M20 Preview API and Firebase metadata
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          url = os.environ['API_URL']
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme != 'https' or parsed.username or parsed.password
              or parsed.port or parsed.query or parsed.fragment
              or parsed.path != '/api/v1'
              or parsed.hostname != 'praise-app-git-feat-m20-phase-8825ce-henriquecesarths-projects.vercel.app'):
              raise SystemExit('Expected the current M20 branch Preview API; production/custom domains are forbidden.')
          config = json.loads(Path('android/app/google-services.json').read_text())
          if config.get('project_info', {}).get('project_id') != 'praise-app-7a362':
              raise SystemExit('Firebase metadata must identify the existing authorized project.')
          packages = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in config.get('client', [])]
          if 'com.louvaio.app' not in packages:
              raise SystemExit('Firebase metadata must include the full app package.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'API_URL={url}\n')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          blocked = False
          for path, expected in [('/api/health', 200), ('/api/v1/auth/me', 401)]:
              try:
                  response = opener.open(f'{parsed.scheme}://{parsed.netloc}{path}', timeout=25)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  status = response.code
                  content_type = response.headers.get('Content-Type', '')
                  location = response.headers.get('Location', '')
                  body = response.read(65536)
              print(f'{path}: HTTP {status}; content-type={content_type}')
              if status in (301, 302, 303, 307, 308) and urllib.parse.urlsplit(location).hostname == 'vercel.com':
                  blocked = True
                  print(f'::warning::{path} is protected by Vercel Authentication; the APK will retain the M20 Preview URL, and authenticated API calls from Android will be blocked.')
                  continue
              if 'application/json' not in content_type or status != expected:
                  raise SystemExit('M20 Preview API returned an unexpected response; refusing build.')
              data = json.loads(body)
              if path == '/api/health' and (data.get('service') != 'praise-backend' or data.get('status') != 'ok' or data.get('preview') is not True):
                  raise SystemExit('Health must identify the healthy M20 Preview backend.')
              if path.endswith('/auth/me') and not isinstance(data.get('error'), dict):
                  raise SystemExit('Expected application authentication error.')
          readiness = ('BLOCKED: Android cannot pass Vercel SSO for the M20 Preview API; no production API fallback is configured.' if blocked else 'M20 branch Preview API is reachable; Firebase uses praise-app-7a362.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'API: `{url}`\n\n{readiness}\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Verify Flutter & Dart environment
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build complete production-flavor app APK
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --flavor production \
            --target lib/main.dart \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Verify APK package, Firebase, API, sharing and checksum
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-production-debug.apk
          test -s "$APK"
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$AAPT_BIN" dump badging "$APK" | grep -F "package: name='com.louvaio.app'" > /dev/null
          "$AAPT_BIN" dump permissions "$APK" | grep -F 'android.permission.INTERNET' > /dev/null
          "$AAPT_BIN" dump xmltree "$APK" AndroidManifest.xml > /tmp/louvaio-manifest.txt
          for expected in FirebaseInitProvider android.intent.action.SEND text/plain application/pdf 'image/*'; do
            grep -F "$expected" /tmp/louvaio-manifest.txt > /dev/null
          done
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-production-debug.apk') as apk:
              kernel = apk.read('assets/flutter_assets/kernel_blob.bin')
              assert os.environ['API_URL'].encode() in kernel, 'M20 Preview API URL missing from APK'
              assert b'praise-app-7a362' in kernel, 'Existing Firebase project missing from APK'
          PY
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/apk-sha256.txt
          {
            echo "Commit: $GITHUB_SHA"
            echo "Target: lib/main.dart; flavor: production; APP_ENV: production"
            echo "API: $API_URL"
            cat build/app/outputs/flutter-apk/apk-sha256.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: louvaio-android-debug-full-app
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/flutter-apk/apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
